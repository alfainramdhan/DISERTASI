   PICTURE: pipeline approval berbentuk chevron + banner beranda dengan siluet crane dan jembatan
   COLOUR and TYPE: abu beton & putih, charcoal #1d2225, oranye #e8590c, biru baja #1d5f86; Plus Jakarta Sans
   LAYOUT: sidebar di kiri, header lengket, kartu & tabel, drawer kanan untuk detail */
:root{color-scheme:light dark;
--bg:light-dark(#f2f3f0,#0f1214);--panel:light-dark(#ffffff,#171c1f);--sub:light-dark(#f6f7f4,#1d2327);
--ink:light-dark(#1a1f23,#e6eaec);--mute:light-dark(#5a646a,#9aa5ab);--line:light-dark(#e1e4df,#2a3136);
--side:#1d2225;--side2:#2a3135;--sideink:#c7cfd3;
--acc:#e8590c;--accs:light-dark(#fff0e6,#3a2215);--acci:light-dark(#b8430a,#ff9a5c);
--steel:light-dark(#1d5f86,#72b5dd);--steels:light-dark(#e6f0f6,#15303f);
--ok:light-dark(#0f7150,#4cc08f);--oks:light-dark(#e3f3ea,#11301f);
--warn:light-dark(#8f5400,#f0b44c);--warns:light-dark(#fcf0d6,#3a2c10);
--bad:light-dark(#b42318,#f48a80);--bads:light-dark(#fde7e4,#3d1714);
--shadow:0 1px 2px rgba(16,20,22,.06),0 4px 16px rgba(16,20,22,.05)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(24px,2.6vw,32px);font-weight:800}h2{font-size:20px;font-weight:800}h3{font-size:16px;font-weight:700}
small,.muted{color:var(--mute);font-size:13px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s}
.app.col{grid-template-columns:78px minmax(0,1fr)}
/* sidebar */
.side{background:var(--side);color:var(--sideink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:0 10px 10px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:18px 6px 14px;color:#fff}
.logo{width:40px;height:40px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.bt b{display:block;font-size:19px;letter-spacing:.06em;line-height:1.1}.bt small{color:#98a3a9}
.navl{font-size:13px;color:#8e989e;margin:12px 8px 6px}
.mi{display:flex;align-items:center;gap:11px;width:100%;padding:6px 8px;border:0;background:none;color:inherit;text-align:left;border-radius:10px;min-height:46px;cursor:pointer}
.mi:hover{background:var(--side2)}
.mi.on{background:var(--side2);color:#fff}
.lt{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800;background:#30383d;color:#fff;font-size:16px}
.mi.on .lt{background:var(--acc)}
.mt{flex:1;font-size:14px;font-weight:600;line-height:1.25}
.chev{transition:transform .2s;opacity:.7}.chev.o{transform:rotate(90deg)}
.badge{background:var(--acc);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700;line-height:18px}
.subs{list-style:none;margin:2px 0 8px 24px;padding:0 0 0 14px;border-left:1px solid #3a4348}
.subs button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;color:#aeb8bd;text-align:left;padding:8px 10px;border-radius:8px;min-height:40px;font-size:14px;cursor:pointer}
.subs button:hover{color:#fff;background:#262d31}.subs button.on{color:#fff;background:#262d31;box-shadow:inset 3px 0 0 var(--acc)}
.sfoot{margin-top:auto;padding-top:12px}
.col .mt,.col .chev,.col .subs,.col .bt,.col .navl,.col .mi .badge,.col .sfoot span{display:none}
.col .mi{justify-content:center;padding:6px 0}.col .brand{justify-content:center}
.col .lt{position:relative}
/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2.4vw,28px)}
.crumb{font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px;align-items:center}.crumb b{color:var(--ink)}
.gsearch{position:relative;flex:1;max-width:440px;margin-left:auto}
.gsearch input{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:var(--sub);padding:0 42px 0 40px;font-size:16px}
.gi{position:absolute;left:13px;top:13px;color:var(--mute)}
.gsearch kbd{position:absolute;right:10px;top:11px;border:1px solid var(--line);border-radius:6px;padding:0 7px;font:600 13px/20px inherit;color:var(--mute);background:var(--panel)}
.pop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.16);padding:6px;display:none;max-height:70vh;overflow:auto;z-index:60}
.pop.show{display:block}
.pop h4{margin:8px 10px 4px;font-size:13px;color:var(--mute);font-weight:600}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.pop button:hover,.pop button:focus-visible{background:var(--sub)}
.pop button small{display:block}
.iconbtn{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;position:relative;cursor:pointer;flex:none}
.cnt{position:absolute;top:-5px;right:-5px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.nwrap{position:relative}
.npop{position:absolute;right:0;top:52px;width:min(380px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.18);z-index:60;overflow:hidden}
.npop header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.npop ul{list-style:none;margin:0;padding:6px;max-height:60vh;overflow:auto}
.npop li button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer}
.npop li button:hover{background:var(--sub)}
.ndot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.prof{display:flex;gap:10px;align-items:center;flex:none}
.av{width:40px;height:40px;border-radius:50%;background:var(--accs);color:var(--acci);display:grid;place-items:center;font-weight:800}
.prof b{display:block;font-size:14px;line-height:1.2}.prof small{display:block;line-height:1.3}
.mbtn{display:none}
main{padding:22px clamp(14px,2.4vw,28px) 90px;max-width:1440px}
/* shared */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ph{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.ph p{margin:6px 0 0;color:var(--mute)}
.btn{min-height:42px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.badb{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:20px}
.t-ok{background:var(--oks);color:var(--ok)}.t-warn{background:var(--warns);color:var(--warn)}.t-bad{background:var(--bads);color:var(--bad)}
.t-steel{background:var(--steels);color:var(--steel)}.t-mute{background:var(--sub);color:var(--mute);border:1px solid var(--line)}.t-acc{background:var(--accs);color:var(--acci)}
.pill,.chip{border:1px solid var(--line);border-radius:999px;padding:0 14px;background:var(--panel);font-size:14px;min-height:40px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.pill.on,.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip b{font-weight:800;color:var(--acci)}.chip.on b{color:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.kpi{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit}
.kpi:hover{border-color:var(--acc)}
.kpi .k{font-size:14px;color:var(--mute);font-weight:600}
.kpi .v{font-size:clamp(26px,3vw,34px);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:13px;color:var(--mute);text-align:left;font-weight:600;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sub)}
tr.sel td{background:var(--accs)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
.lnk{border:0;background:none;padding:0;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
.lnk:hover{color:var(--acci);text-decoration:underline}
.cp{border:0;background:none;color:var(--mute);cursor:pointer;padding:2px 4px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;font-size:13px;min-height:28px}
.cp:hover{color:var(--acci);background:var(--accs)}
.vd{display:inline-flex;gap:3px;margin-top:6px}.vd i{font-style:normal;font-size:13px;font-weight:700;padding:0 5px;border-radius:5px;background:var(--sub);color:var(--mute);border:1px solid var(--line)}
.vd i.y{background:var(--oks);color:var(--ok);border-color:transparent}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:34px;font-size:13px;font-weight:700;cursor:pointer;background:var(--sub);color:var(--mute)}
.tog.on{background:var(--oks);color:var(--ok);border-color:transparent}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);cursor:pointer}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);color:var(--panel);border-radius:12px;padding:8px 10px 8px 16px;margin-bottom:10px}
.bulk .btn{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--panel) 30%,transparent)}
.bulk .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--mute)}
.f input,.f select,.f textarea,.inp{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 12px;font-size:16px;color:var(--ink);font-weight:400;width:100%}
.f textarea,textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.empty{text-align:center;padding:44px 20px;color:var(--mute)}
.empty svg{display:block;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty p{margin:0 0 14px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.gap{display:grid;gap:18px}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--side);color:#fff;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:18px;align-items:end;
background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px}
.hero h1{font-size:clamp(26px,3.2vw,40px);color:#fff}
.hero p{margin:8px 0 0;color:#c2cbd0}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero .meta span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:4px 11px;border-radius:999px;font-size:13px}
.hero svg{width:100%;height:auto;max-height:190px}
.hero kbd{border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:0 6px;font:inherit;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tabs>*{flex:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.mod{display:flex;flex-direction:column;gap:10px}
.mod header{display:flex;gap:12px;align-items:flex-start}
.mod .lt{width:40px;height:40px;font-size:19px;background:var(--side)}
.mod ol{margin:0;padding:0;list-style:none;counter-reset:n;display:grid;gap:2px}
.mod li{counter-increment:n}
.mod li button{display:flex;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:14px;min-height:34px;align-items:center}
.mod li button::before{content:counter(n)".";color:var(--mute);font-weight:700;width:20px;flex:none}
.mod li button:hover{background:var(--sub);color:var(--acci)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.fig{position:relative;min-height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bars{display:grid;gap:14px}
.bar .lab{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.bar .tr{height:10px;background:var(--sub);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .tr i{display:block;height:100%;background:var(--steel);border-radius:6px}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(158px,1fr));gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.stg{border:0;text-align:left;cursor:pointer;padding:14px 26px 14px 24px;background:var(--panel);color:var(--ink);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);min-height:118px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 1px var(--line)}
.stg:first-child{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);padding-left:16px;border-radius:12px 0 0 12px}
.stg:hover{background:var(--sub)}
.stg.on{background:var(--acc);color:#fff}
.stg .n{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stg small{color:inherit;opacity:.75}
.stg b{font-size:14px;line-height:1.25}
/* drawer & modal */
.ovl{position:fixed;inset:0;background:rgba(10,14,16,.5);z-index:70;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(760px,100%);background:var(--bg);z-index:71;overflow-y:auto;box-shadow:-12px 0 48px rgba(0,0,0,.25);animation:slide .22s ease-out}
.dh{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;z-index:2}
.dh h2{font-size:22px}
.db{padding:18px 20px 40px;display:grid;gap:16px}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--panel);padding:0 14px;position:sticky;top:var(--dh,86px);z-index:1}
.dtabs button{border:0;background:none;padding:12px 12px;font-weight:700;font-size:14px;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;min-height:46px}
.dtabs button.on{color:var(--ink);border-color:var(--acc)}
dl.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px 18px;margin:0}
dl.kv dt{font-size:13px;color:var(--mute)}dl.kv dd{margin:2px 0 0;font-weight:600}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.doc:hover{border-color:var(--acc)}
.doc .ico{width:36px;height:42px;border-radius:5px;background:var(--steels);color:var(--steel);display:grid;place-items:center}
.vbox{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;display:grid;gap:12px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px}
.vitem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--sub)}
.vitem.y{background:var(--oks);border-color:transparent}
.vitem input{margin-top:3px}
.vitem small{display:block}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:118px;height:118px;flex:none}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps div{font-size:13px;font-weight:600;color:var(--mute);border-top:4px solid var(--line);padding-top:6px;line-height:1.3}
.steps .d{border-color:var(--ok);color:var(--ok)}.steps .c{border-color:var(--acc);color:var(--ink)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 30px}
.tl li::before{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tl .when{font-size:13px;color:var(--mute)}
.tl .nt{margin-top:4px;background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border-radius:16px;z-index:81;box-shadow:0 24px 80px rgba(0,0,0,.3);animation:fade .15s}
.modal .dh{border-radius:16px 16px 0 0}
.ovl.m{z-index:80}
.paper{background:#fff;color:#1a1f23;border:1px solid #d9dcd6;border-radius:6px;padding:28px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.paper h3{text-align:center;text-decoration:underline;margin-bottom:4px}
.paper .c{text-align:center;color:#555;margin-bottom:18px}
.paper table td{border:0;padding:4px 0}.paper table td:first-child{width:42%;color:#555}
.paper .stamp{margin-top:22px;display:flex;justify-content:space-between;gap:20px;font-size:13px;color:#555}
.ta{width:100%;min-height:200px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--sub);color:var(--ink)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;display:grid;gap:8px;width:min(440px,calc(100vw - 24px))}
.tst{background:var(--ink);color:var(--panel);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .2s}
/* chat */
.fab{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;background:var(--acc);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;z-index:65;box-shadow:0 10px 28px rgba(232,89,12,.4)}
.chat{position:fixed;right:20px;bottom:92px;width:min(400px,calc(100vw - 24px));height:min(600px,calc(100vh - 120px));background:var(--panel);border:1px solid var(--line);border-radius:18px;z-index:66;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:hidden;animation:fade .15s}
.chat header{background:var(--side);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center}
.chat header small{color:#aeb8bd;display:block}
.chat header .iconbtn{background:transparent;border-color:#3a4348;color:#fff;margin-left:auto;width:38px;height:38px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sub)}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5}
.msg.bot{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg ul{margin:6px 0;padding-left:18px}.msg .btn{margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-top:1px solid var(--line)}
.chips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 12px;min-height:36px;font-size:13px;cursor:pointer;font-weight:600}
.chips button:hover{border-color:var(--acc);color:var(--acci)}
.chat form{display:flex;gap:8px;padding:10px 12px 12px}
.chat form input{flex:1;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:16px;background:var(--sub)}

/* HAIDAR: AI DECISION */
.lt.ai{background:linear-gradient(135deg,#e8590c,#b8430a)!important;font-size:14px;letter-spacing:.02em}
.badge.nw2{background:var(--steel);color:#0f1214;font-size:11px;padding:0 7px}
.kpi.static{cursor:default}.kpi.static:hover{border-color:var(--line)}
.kpi.static .v{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.kpi.static .v .tag{font-size:13px}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}.pk .card{box-shadow:none;background:var(--sub)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:16px}
.pg:first-child{margin-top:0}
.radar{width:100%;height:auto;max-height:330px;display:block;margin:6px auto 0}
.mb{flex:1;height:8px;min-width:70px;background:var(--sub);border:1px solid var(--line);border-radius:6px;overflow:hidden}.mb i{display:block;height:100%;border-radius:6px}
.lf{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--ok);background:var(--oks);border-radius:999px;padding:0 7px;vertical-align:middle;line-height:18px}
tr.grp td{background:var(--sub);padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.sl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}.sl li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:14px}
.wsl{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:14px}.wsl input[type=range]{width:100%;accent-color:var(--acc)}.wsl output{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
details summary{font-weight:700}
@media(max-width:600px){.wsl{grid-template-columns:1fr 1fr 48px}}
.dtabs button{flex:none}
.blogo{width:46px;height:46px;flex:none;object-fit:contain;filter:drop-shadow(0 0 8px rgba(40,160,255,.35))}
.col:not(.peek) .blogo{width:40px;height:40px}
.vitem.lk{opacity:.6;cursor:not-allowed}.vitem.lk input{cursor:not-allowed}
.dchat{display:flex;flex-direction:column;height:min(66vh,620px);padding:0;overflow:hidden}.dchat .msgs{flex:1}.dchat form{display:flex;gap:8px;padding:10px 12px 12px}.dchat form input{flex:1;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:16px;background:var(--sub)}
.app.col.peek .side{width:268px;z-index:60;box-shadow:12px 0 40px rgba(0,0,0,.35)}
.app.col.peek .mt,.app.col.peek .navl{display:block}.app.col.peek .chev{display:inline-block}.app.col.peek .bt{display:block}.app.col.peek .subs{display:block}.app.col.peek .mi .badge,.app.col.peek .sfoot span{display:inline-block}
.app.col.peek .mi{justify-content:flex-start;padding:6px 8px}.app.col.peek .brand{justify-content:flex-start}
.modal.wide{width:min(1020px,calc(100vw - 24px))}
.vd i.n{background:var(--bads);color:var(--bad);border-color:transparent}.vd i.w{background:var(--warns);color:var(--warn);border-color:transparent}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
.app,.app.col{grid-template-columns:minmax(0,1fr)}
.side{position:fixed;left:0;top:0;width:286px;transform:translateX(-105%);transition:transform .2s;box-shadow:12px 0 40px rgba(0,0,0,.3)}
.app.mob .side{transform:none}
.mbtn{display:grid}.colbtn{display:none}
.prof div,.crumb{display:none}

function vList(){

 const has=(a,b)=>String(a).toLowerCase().includes(String(b).toLowerCase());
 if(f.q)L=L.filter(v=>has(v.nama+' '+v.email,f.q));if(f.npwp)L=L.filter(v=>has(v.npwp.replace(/\D/g,''),f.npwp.replace(/\D/g,''))||has(v.npwp,f.npwp));

 if(f.wilayah)L=L.filter(v=>v.wilayah===f.wilayah);if(f.kual)L=L.filter(v=>v.kual===f.kual);
 if(f.sap)L=L.filter(v=>f.sap==='Synced'?v.sap:!v.sap);if(f.appr)L=L.filter(v=>v.divisi===f.appr);if(f.akses)L=L.filter(v=>f.akses==='Locked'?v.locked:!v.locked);

function PDF(){

 const T=(x,yy,s,sz=9,b=0,col)=>cur.push(`${col||'0 g'} BT /F${b?2:1} ${sz} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${q(s)}) Tj ET`);
 const R=(x,yy,w,h,g)=>cur.push(`${g} g ${x.toFixed(1)} ${yy.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f 0 g`);
 const L=(x1,y1,x2,y2)=>cur.push(`0.8 G ${x1} ${y1.toFixed(1)} m ${x2} ${y2.toFixed(1)} l S`);
 const wrap=(s,n)=>{const o=[];String(s??'').split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{if((l+' '+w).trim().length>n&&l){o.push(l);l=w}else l=(l+' '+w).trim()});o.push(l)});return o};
 np();
 const P={
  need(h){if(y-h<M+24)np()},
  title(t,sub){T(M,y,t,15,1);y-=17;if(sub){wrap(sub,100).forEach(l=>{T(M,y,l,8.5,0,'0.4 g');y-=11});}L(M,y,W-M,y);y-=14},
  h(t){this.need(46);y-=6;T(M,y,t,11.5,1);y-=15},
  p(t,sz=9){wrap(t,Math.floor((W-2*M)/(sz*.52))).forEach(l=>{this.need(14);T(M,y,l,sz);y-=sz*1.4});y-=4},
  table(head,rows,w){const fs=8.5,pad=4,tw=w.reduce((a,b)=>a+b,0);
   const draw=(cells,hd)=>{const ls=cells.map((c,i)=>wrap(c,Math.max(3,Math.floor((w[i]-2*pad)/(fs*.52)))));const n=Math.max(...ls.map(a=>a.length)),hh=n*fs*1.3+pad*2;
    if(y-hh<M+24){np();if(!hd)draw(head,1)}
    if(hd)R(M,y-hh,tw,hh,'0.92');let x=M;ls.forEach((a,i)=>{a.forEach((l,k)=>T(x+pad,y-pad-fs-k*fs*1.3+1.5,l,fs,hd));x+=w[i]});y-=hh;L(M,y,M+tw,y)};
   draw(head,1);rows.forEach(r=>draw(r.map(String),0));y-=10},
  save(name){
   pages.forEach((p,i)=>{cur=p;T(M,22,'HAIDAR AI · Data contoh untuk demo',7,0,'0.5 g');T(W-M-50,22,`Halaman ${i+1} / ${pages.length}`,7,0,'0.5 g')});
   const objs=['<< /Type /Catalog /Pages 2 0 R >>',`<< /Type /Pages /Kids [${pages.map((_,i)=>(5+2*i)+' 0 R').join(' ')}] /Count ${pages.length} >>`,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
   pages.forEach((p,i)=>{const c=p.join('\n');objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+2*i} 0 R >>`,`<< /Length ${c.length} >>\nstream\n${c}\nendstream`)});
   let out='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
   const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
   const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));a.download=name;document.body.append(a);a.click();a.remove();toast('File '+name+' diunduh')}};
 return P}

 vok:v=>{const x=V[+v];if(USER.role!=='VPO'){toast('Penetapan akhir hanya oleh VPO');return}x.tahap=x.wilayah==='Internasional'?'Rekanan Internasional':'Rekanan Terseleksi';x.setuju=new Date();x.locked=true;x.log.push({t:new Date(),who:USER.nama,jab:USER.jabatan+' · Komite Seleksi Rekanan',act:'Ditetapkan sebagai '+x.tahap,note:'Verifikasi 4/4 lengkap.',c:'ok'});toast(x.nama+' kini '+x.tahap);render()},
 vtab:v=>{S.vTab=+v;renderDrawer()},
 vdoc:v=>{const [i,d]=v.split('|'),x=V[+i];docModal(d,d==='NPWP'?x.npwp:x.id+'/'+d.split(' ')[0].toUpperCase(),[['Nama pemegang',x.nama],['Alamat / domisili',x.kota],['Bidang usaha',x.bidang],['Penanggung jawab',x.kontak],['Status verifikasi',x.verif[1]?'Terverifikasi Tim Legal':'Menunggu verifikasi']],'Instansi Penerbit',x.kontak)},
 stage:v=>{S.iStage=+v;S.iSel.clear();render()},iReset:()=>{S.iStage=0;S.iq={kw:'',div:'',proj:''};S.iDone=false;render()},
 idone:(v,t)=>{S.iDone=t.checked;refreshInv()},
 isel:(v,t)=>{t.checked?S.iSel.add(v):S.iSel.delete(v);refreshInv()},
 iall:(v,t)=>{iList().filter(x=>x.stage<=5).forEach(x=>t.checked?S.iSel.add(x.no):S.iSel.delete(x.no));refreshInv()},
 ib:v=>{if(v==='ok'){const L=I.filter(x=>S.iSel.has(x.no)&&x.stage<=5);L.forEach(x=>approve(x,'Persetujuan massal (bulk approve).'));toast(`${L.length} tagihan disetujui dan dipindahkan ke tahap berikutnya`)}S.iSel.clear();render()},
 iok:v=>{const x=I.find(i=>i.no===v),from=STG[x.stage];approve(x,$('#anote').value.trim());S.note='';toast(`${x.no}: ${from} → ${x.stage>5?'Selesai':STG[x.stage]}`);S.drw.keep=true;render()},
 iret:v=>{const x=I.find(i=>i.no===v),n=$('#anote').value.trim();if(!n){$('#aerr').textContent='Catatan revisi wajib diisi sebelum mengembalikan berkas.';$('#anote').focus();return}
  x.hist.push({t:new Date(),n:USER.nama,j:USER.jabatan,s:'Dikembalikan',tahap:STG[x.stage],note:n});x.stage=1;x.hari=0;x.ret=true;S.note='';toast(`${x.no} dikembalikan ke rekanan untuk revisi`);S.drw.keep=true;render()},
 idoc:v=>{const [no,d]=v.split('|'),x=I.find(i=>i.no===no),ven=V[x.vi];docModal(d,no+'/'+d.split(' ').map(w=>w[0]).join('').toUpperCase(),[['Nomor kontrak',x.ktr],['Pekerjaan',x.pek],['Proyek',x.proj],['Nilai',rp(x.nilai)],['Terbilang','(sesuai nilai tagihan)'],['Rekanan',ven.nama],['Tanggal',fD(x.hist[0].t)]],APR[0][0],ven.kontak)},
 exp:v=>{const [kind,fmt]=v.split('|');S.mdl={type:'exp',kind,fmt};renderModal()},
 imp:()=>{S.mdl={type:'imp'};renderModal()},addV:()=>{S.mdl={type:'addV'};renderModal()},post:()=>{S.mdl={type:'post'};renderModal()},
 chat:()=>{S.chatOpen=!S.chatOpen;if(S.chatOpen&&!S.chat.length)S.chat.push({f:'bot',h:`Halo ${USER.nama.split(' ')[0]}, saya Asisten HAIDAR AI. ${bot('')}`});renderChat();if(S.chatOpen)$('#cq')?.focus()},
 ask:v=>ask(v),
 wf:v=>{S.wf=v;render()},win:v=>{S.mdl={type:'win',i:+v};renderModal()},
 wopen:v=>{go(5,'Pemenang Lelang & Approval');S.mdl={type:'win',i:+v};renderModal()},
 wok:v=>{const t=TN[+v],w=tState(t).indexOf('wait');if(w<0)return;if(STK[w][1]!==USER.role){toast(`Tahap ini hanya dapat diproses ${STK[w][0]}`);return}t.a[w]={d:new Date(),bad:false,note:($('#wnote').value.trim()||STKOK[w])};toast(`${STK[w][0]} menyetujui ${t.k}`);renderModal();render()},
 wno:v=>{const t=TN[+v],w=tState(t).indexOf('wait'),n=$('#wnote').value.trim();if(w<0)return;if(STK[w][1]!==USER.role){toast(`Tahap ini hanya dapat diproses ${STK[w][0]}`);return}if(!n){$('#werr').textContent='Alasan wajib diisi sebelum menyatakan tidak setuju.';$('#wnote').focus();return}t.a[w]={d:new Date(),bad:true,note:n};toast(`${t.k} tidak disetujui oleh ${STK[w][0]}`);renderModal();render()},
 wre:v=>{const t=TN[+v],b=tState(t).indexOf('bad');if(b<0)return;if(STK[b][1]!==USER.role){toast(`Hanya ${STK[b][0]} yang dapat membuka kembali`);return}t.a[b]=null;toast(`Penolakan ${STK[b][0]} dibuka kembali`);renderModal();render()},
 pdfv:v=>pdfVendor(V[+v]),pdfr:()=>pdfRanking(),dask:v=>dsend(v),
 cmpv:v=>{const [a,b]=v.split('|').map(Number);S.cmp=[a,b,S.cmp[2]===a||S.cmp[2]===b?S.cmp.find(x=>x!==a&&x!==b)??0:S.cmp[2]];go(8,'Bandingkan Vendor')},
 aiFin:v=>{S.pv=+v;S.pf='all';S.pj='Semua';S.rb='Semua';go(8,'Performa 50 Kriteria');setTimeout(()=>$('#finb')?.scrollIntoView({behavior:'smooth'}),80)},
 pf:v=>{S.pf=v;keepR()},pj:v=>{S.pj=v;render()},pre:v=>{W=[...PRE[v]];S.pre=v;render()},
 aiPerf:v=>{S.pv=+v;S.pf='all';go(8,'Performa 50 Kriteria')},
 rexp:()=>dl('ranking-vendor-haidar.csv',[['Peringkat','Rekanan','Jenis','Bidang','Skor AI','Indeks Hijau','Rekomendasi',...CATG],...ranked().map((x,k)=>[k+1,x.v.nama,jenisV(x.v),x.v.bidang,Math.round(x.s),Math.round(x.g),rec(x.v)[0],...catSc(x.v).map(Math.round)])]),
 pexp:v=>{const x=V[+v],c=crit(x);dl('performa-50-kriteria-'+x.id+'.csv',[['No','Kategori','Kriteria','GSCM','Skor','Penilaian'],...CR.map((q,k)=>[k+1,CATG[q[0]],q[1],q[3]?'Ya':'',c[k],grade(c[k])[0]])])},
 reset:()=>{init();W=[...PRE['Seimbang']];S.pre='Seimbang';S.drw=null;S.vSel.clear();S.iSel.clear();S.vf={};S.vPill='Semua Data';S.iStage=0;toast('Data demo dikembalikan ke kondisi awal');render()}};
function dl(name,rows){const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.append(a);a.click();a.remove();toast('File '+name+' diunduh')}
function addVendor(o){const i=V.length;const v=mkV([o.nama,o.email,o.kontak,o.npwp,0,'Bakal Calon Rekanan',null,o.divisi,0,0,o.kual,o.bidang,o.wilayah,'0000',null,null,0,null,null,'–'],i);v.reg=new Date();v.log[0].t=new Date();v.log[0].note='Ditambahkan manual oleh '+USER.nama+'.';V.push(v);return v}

const sideRender=()=>{$('#app').className='app'+(S.col?' col':'')+(S.peek?' peek':'')+(S.mob?' mob':'');$('#side').innerHTML=sideHTML()};
$('#side').addEventListener('mouseenter',()=>{if(S.col&&!S.peek&&innerWidth>900){S.peek=true;sideRender()}});
$('#side').addEventListener('mouseleave',()=>{if(S.peek){S.peek=false;sideRender()}});
document.addEventListener('click',e=>{
 if(!S.col&&innerWidth>900&&!e.target.closest('.side')&&!e.target.closest('.mbtn')){S.col=true;S.peek=false;sideRender()}
 const g=e.target.closest('.gsearch');if(!g)$('#gres')?.classList.remove('show');
 if(S.nOpen&&!e.target.closest('.nwrap')){S.nOpen=false;$('#top').innerHTML=topHTML()}
 const t=e.target.closest('[data-a]');if(!t)return;
 if(t.closest('.chat')&&(t.dataset.a==='oInv'||t.dataset.a==='oVen'||t.dataset.a==='go')&&innerWidth<700){S.chatOpen=false;renderChat()}
 const f=A[t.dataset.a];if(f){if(t.tagName==='A')e.preventDefault();f(t.dataset.v,t,e)}});
document.addEventListener('input',e=>{
 if(e.target.id==='gq'){S.q=e.target.value;const r=$('#gres');r.innerHTML=gSearch(S.q);r.classList.toggle('show',!!S.q.trim())}
 if(e.target.dataset.f==='kw'){S.iq.kw=e.target.value;refreshInv()}
 if(e.target.id==='anote')S.note=e.target.value;
 if(e.target.dataset.w!==undefined){W[+e.target.dataset.w]=+e.target.value;S.pre='Kustom';CATG.forEach((_,g)=>{const o=$('#wv'+g);if(o)o.textContent=pctOf(g)+'%'});const t=$('#wtot');if(t)t.textContent=W.reduce((a,b)=>a+b,0)}});
document.addEventListener('change',e=>{
 const k=e.target.dataset.f;if(k==='div'||k==='proj'){S.iq[k]=e.target.value;refreshInv()}
 if(k==='role'){USER.role=e.target.value;USER.jabatan=USER.role==='VPO'?'VPO':'Simulasi: '+ROLES[USER.role];render();toast('Peran demo: '+ROLES[USER.role])}
 if(k==='rb'){S.rb=e.target.value;render()}
 if(k==='pv'){S.pv=+e.target.value;render()}
 if(/^cmp[012]$/.test(k||'')){S.cmp[+k[3]]=+e.target.value;render()}
 if(e.target.dataset.w!==undefined)render();
 if(e.target.id==='impf'){const file=e.target.files[0];if(!file)return;if(!/\.csv$/i.test(file.name)){$('#imsg').textContent='Untuk pratinjau ini gunakan file .csv (Excel: Simpan Sebagai → CSV).';return}
  file.text().then(txt=>{const rows=txt.split(/\r?\n/).slice(1).map(l=>l.split(',').map(c=>c.trim())).filter(r=>r[0]);
   rows.forEach(r=>addVendor({nama:r[0],email:r[1]||'-',kontak:r[2]||'-',npwp:r[3]||'-',bidang:r[4]||'Pekerjaan Beton',wilayah:r[5]||'Nasional',kual:r[6]||'Kecil',divisi:r[7]||USER.divisi}));
   S.mdl=null;renderModal();toast(rows.length+' rekanan diimpor sebagai Bakal Calon Rekanan');go(0,'Bakal Calon Rekanan')})}});
document.addEventListener('submit',e=>{e.preventDefault();const fm=e.target,o=Object.fromEntries(new FormData(fm));
 if(fm.id==='vff'){S.vf=o;S.vSel.clear();render()}
 if(fm.id==='fadd'){const v=addVendor(o);S.mdl=null;renderModal();toast(v.nama+' ditambahkan sebagai Bakal Calon Rekanan');go(0,'Bakal Calon Rekanan')}
 if(fm.id==='fpost'){const nilai=+String(o.nilai).replace(/\D/g,'');if(!nilai){toast('Nilai tagihan belum valid');return}const no='BAP-'+String(I.length+1).padStart(3,'0');
  const x=mkI([no,o.ktr,+o.vi,o.pek,o.proj,o.proj==='Kantor Pusat'?'Operasional':'Proyek',nilai,1,0]);x.hist[0]={t:new Date(),n:USER.nama,j:USER.jabatan,s:'Diajukan',tahap:'Post Invoice',note:'Tagihan diinput melalui menu Post Invoice.'};I.push(x);S.mdl=null;renderModal();toast(no+' masuk antrean Konfirmasi Proyek');openInv(no)}
 if(fm.id==='dcf'){const i=$('#dq');dsend(i.value);i.value=''}
 if(fm.id==='chatf'){const i=$('#cq');ask(i.value);i.value=''}});
document.addEventListener('keydown',e=>{
 const tg=e.target.tagName;
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(tg)){e.preventDefault();$('#gq')?.focus()}
 if(e.key==='Escape'){if(S.mdl){S.mdl=null;renderModal()}else if(S.drw){S.drw=null;renderDrawer()}else if(S.nOpen){S.nOpen=false;render()}else{$('#gres')?.classList.remove('show')}}
 if(e.key==='Enter'&&e.target.id==='gq'){e.preventDefault();$('#gres button')?.click()}});
render();
}
</script>

/* Streamlit: paskan tinggi iframe dengan tinggi jendela */
try{const f=window.frameElement;if(f){const fit=()=>{f.style.height=window.parent.innerHeight+'px'};fit();window.parent.addEventListener('resize',fit)}}catch(e){}
</script>
